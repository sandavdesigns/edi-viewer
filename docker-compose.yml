services:
  edi-viewer:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    command: >
      sh -c "export APP_THEME=\"$${APP_THEME:-$${THEME:-}}\" APP_NAME=\"$${APP_NAME:-$${NAME:-}}\"
      && rm -rf /usr/share/nginx/html/* /tmp/edi-viewer.tar.gz /tmp/edi-viewer-main
      && wget -O /tmp/edi-viewer.tar.gz https://github.com/sandavdesigns/edi-viewer/archive/refs/heads/main.tar.gz
      && tar -xzf /tmp/edi-viewer.tar.gz -C /tmp
      && cp -r /tmp/edi-viewer-main/index.html /tmp/edi-viewer-main/styles.css /tmp/edi-viewer-main/app.js /tmp/edi-viewer-main/config.js /tmp/edi-viewer-main/config.template.js /tmp/edi-viewer-main/examples /usr/share/nginx/html/
      && envsubst < /usr/share/nginx/html/config.template.js > /usr/share/nginx/html/config.js
      && nginx -g 'daemon off;'"
    restart: unless-stopped
